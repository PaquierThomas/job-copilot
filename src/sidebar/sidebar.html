<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mon extension</title>
    <link rel="stylesheet" href="sidebar.css" />
  </head>

  <body>
    <header class="header">
      <section>
        <button id="profile" class="profil-btn" title="Profil" data-tab="profile">
          Profil
        </button>
      </section>
      <section>
        <button id="documents" class="documents-btn" title="Documents" data-tab="documents">
          Documents
        </button>
      </section>
      <section>
        <button id="fill" class="fill-btn" title="Remplir" data-tab="fill">
          Remplir
        </button>
      </section>

      <button id="settings" class="settings-btn" title="Paramètres">⚙</button>
    </header>

    <main class="content">
      <section class="profile-card" data-tab="profile" hidden>
        <div class="avatar-placeholder">D</div>

        <div class="profile-info">
          <span class="label">Utilisateur</span>
          <strong id="username">Dominit</strong>
        </div>
      </section>

      <section class="data-card" data-tab="documents" hidden>
        <span class="label">Vos données</span>

        <div class="data-row">
          <span>CV</span>
        </div>

        <div class="data-row">
          <span>Lettre de motivation</span>
        </div>
      </section>
      <section class="data-card" data-tab="fill" hidden>
        <Button>Remplir</Button>
      </section>
    </main>

    <script src="sidebar.js"></script>
  </body>
</html>
