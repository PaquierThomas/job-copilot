<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mon extension</title>
    <link rel="stylesheet" href="sidebar.css" />
  </head>

  <body>
    <header class="header">
      <section>
        <button id="profile" class="profil-btn" title="Profil" data-tab="profile">
          Profil
        </button>
      </section>
      <section>
        <button id="documents" class="documents-btn" title="Documents" data-tab="documents">
          Documents
        </button>
      </section>
      <section>
        <button id="fill" class="fill-btn" title="Remplir" data-tab="fill">
          Remplir
        </button>
      </section>

      <button id="settings" class="settings-btn" title="Paramètres">⚙</button>
    </header>

    <main class="content">
      <section class="profile-card" data-tab="profile">
        <div class="avatar-placeholder">D</div>

        <div class="profile-info">
          <span class="label">Utilisateur</span>
          <strong id="saved-username"></strong>
        </div>
        <div>
            <textarea name="profile-data" id="profile-json"></textarea>
            <button id="save-profile">Enregistrer</button>
        </div>
      </section>

      <section class="data-card" data-tab="documents" hidden>
        <span class="label">Vos données</span>

        <div class="data-row">
          <span>CV</span>
          <input type="text" id="cv-name" placeholder="Nom du fichier" />
          <input type="file" id="cv-upload" accept=".pdf,.doc,.docx" />
          <div>
            <button id="cv-submit">submit</button>
          </div>
        </div>

        <div class="data-row">
          <span>Lettre de motivation</span>
          <input type="text" id="cover-letter-name" placeholder="Nom du fichier" />
          <input type="file" id="cover-letter-upload" accept=".pdf,.doc,.docx" />
          <div>
            <button id="cover-letter-submit">submit</button>
          </div>
        </div>
      </section>
      <section class="data-card" data-tab="fill" hidden>
        <Button>Remplir</Button>
      </section>

      <div id="liste-documents"></div>
    </main>

    <script src="sidebar.js"></script>
  </body>
</html>
